<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data KK Warga - WÁE RUA KOMUNITAS</title>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f0f6ff; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 414px; background: #f7faff; min-height: 100vh; padding: 20px 16px 100px 16px; position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        
        /* Keyframes Animasi Perubahan Warna Otomatis Header */
        @keyframes gantiWarnaOtomatis {
            0%   { background: #1a237e; box-shadow: 0 6px 16px rgba(26, 35, 126, 0.3); }
            25%  { background: #2e7d32; box-shadow: 0 6px 16px rgba(46, 125, 50, 0.3); }
            50%  { background: #8e24aa; box-shadow: 0 6px 16px rgba(142, 36, 170, 0.3); }
            75%  { background: #d97706; box-shadow: 0 6px 16px rgba(217, 119, 6, 0.3); }
            100% { background: #1a237e; box-shadow: 0 6px 16px rgba(26, 35, 126, 0.3); }
        }

        .user-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 16px; 
            margin-top: 10px; 
            padding: 14px 16px; 
            border-radius: 20px; 
            color: white; 
            animation: gantiWarnaOtomatis 8s infinite ease-in-out; 
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #ffffff; }
        .user-info h2 { font-size: 16px; color: #ffffff; font-weight: 800; }
        .user-info p { font-size: 12px; color: rgba(255, 255, 255, 0.85); }
        .header-action { color: #ffffff; font-size: 18px; }

        .card-box { background: white; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .card-title { font-size: 14px; color: #1e3a8a; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

        /* Pencarian */
        .search-box { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 12px; background: #f8fafc; outline: none; margin-bottom: 12px; }

        /* Tabel Styling */
        .table-responsive { width: 100%; overflow-x: auto; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #e2e8f0; color: #334155; }
        th { background-color: #f8fafc; color: #475569; font-weight: 700; position: sticky; top: 0; }

        /* Status Badge */
        .badge-status { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; display: inline-block; }
        .status-sudah { background-color: #dcfce7; color: #166534; }
        .status-belum { background-color: #fee2e2; color: #991b1b; }

        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 414px; background: white; display: flex; justify-content: space-around; padding: 8px 0; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); z-index: 10; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 10px; gap: 2px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: #2563eb; font-weight: 700; }
        .nav-icon-box { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .nav-item.active .nav-icon-box { background: #2563eb; color: white; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header User -->
        <div class="user-header">
            <div class="user-info">
                <img src="https://picsum.photos/100/100?random=50" alt="Foto Warga" class="avatar">
                <div>
                    <h2>WÁE RUA KOMUNITAS</h2>
                    <p>Direktori Data KK Warga</p>
                </div>
            </div>
            <div class="header-action"><i class="fa-solid fa-users-rectangle"></i></div>
        </div>

        <!-- TABEL DATA KK WARGA (READ-ONLY) -->
        <div class="card-box">
            <div class="card-title">
                <span><i class="fa-solid fa-address-book"></i> Daftar KK Kampung Wae Rua</span>
                <span style="font-size: 10px; color: #2e7d32; font-weight: bold;"><i class="fa-solid fa-eye"></i> Sinkron Admin</span>
            </div>

            <input type="text" class="search-box" id="cariKK" onkeyup="cariDataKK()" placeholder="🔍 Cari nama Kepala Keluarga...">
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama KK & Wilayah</th>
                            <th>Beras</th>
                            <th>Status Pesta</th>
                        </tr>
                    </thead>
                    <tbody id="tabelKKUser">
                        <!-- Data dimuat otomatis dari localStorage admin -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
                <div class="nav-icon-box"><i class="fa-solid fa-house-chimney"></i></div>
                <span>Dasbor</span>
            </a>
            <a href="datakk.html" class="nav-item active">
                <div class="nav-icon-box"><i class="fa-solid fa-users-rectangle"></i></div>
                <span>Data KK</span>
            </a>
            <a href="laporan.html" class="nav-item">
                <div class="nav-icon-box"><i class="fa-solid fa-file-lines"></i></div>
                <span>Laporan</span>
            </a>
        </div>
    </div>

    <script>
        const defaultKK = [
            { id: 1, nama: "Bpk. Yosep", rt: "RT 01 / Wae Rua", beras: 20, status: "Sudah" },
            { id: 2, nama: "Bpk. Anton", rt: "RT 02 / Wae Rua", beras: 20, status: "Belum" }
        ];

        function muatDataKKUser() {
            const list = JSON.parse(localStorage.getItem('dataKK_WaeRua')) || defaultKK;
            const tabel = document.getElementById('tabelKKUser');
            tabel.innerHTML = '';

            if (list.length === 0) {
                tabel.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #888; padding: 15px;">Belum ada data KK.</td></tr>`;
                return;
            }

            list.forEach((item, index) => {
                const isSudah = item.status === 'Sudah';
                const statusBadgeClass = isSudah ? 'status-sudah' : 'status-belum';

                tabel.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${item.nama}</strong><br><small style="color:#64748b;">${item.rt || 'Wae Rua'}</small></td>
                        <td>${item.beras || 0} Kg</td>
                        <td><span class="badge-status ${statusBadgeClass}">${item.status}</span></td>
                    </tr>
                `;
            });
        }

        function cariDataKK() {
            const input = document.getElementById("cariKK").value.toUpperCase();
            const tabel = document.getElementById("tabelKKUser");
            const tr = tabel.getElementsByTagName("tr");

            for (let i = 0; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName("td")[1];
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    tr[i].style.display = txtValue.toUpperCase().indexOf(input) > -1 ? "" : "none";
                }
            }
        }

        // Muat data saat halaman dibuka
        muatDataKKUser();

        // Sinkronisasi otomatis apabila admin melakukan perubahan data KK di tab/halaman lain
        window.addEventListener('storage', function(e) {
            if (e.key === 'dataKK_WaeRua') {
                muatDataKKUser();
            }
        });
    </script>
</body>
  </html>
